---
name: Build and publish Pure Data package
on:
    push:
        branches: [main]
        tags: ["v*"]
    workflow_dispatch:
env:
    LIBNAME: xlab
    LIBVERSION: ${{ github.ref_name }}
    PYVERSION: "3.14"
permissions:
    contents: write
jobs:
    macos:
        runs-on: ${{ matrix.machines }}
        strategy:
            matrix:
                precision: [32]
                machines: [macos-latest]
        steps:
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{env.PYVERSION}}
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0
            - name: Install PureData and Deps
              run: |
                  brew install pd
                  brew install boost
            - name: Build
              run: |
                  cmake . -B build -DPD_OUTPUT_PATH="${{ github.workspace }}/xlab" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DPD_FLOATSIZE=${{ matrix.precision }} -DPYVERSION=${{env.PYVERSION}}
                  cmake --build build -j4
            - name: Upload Object
              uses: actions/upload-artifact@v4
              with:
                  name: ${{env.LIBNAME}}-${{env.LIBVERSION}}-${{matrix.machines}}-universal-pd${{matrix.precision}}
                  path: ${{ github.workspace }}/${{ env.LIBNAME }}
                  if-no-files-found: error
    linux-build:
        # Keep the Pure Data PPA on Noble until its Resolute packages are complete.
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                arch: [amd64] #, arm, aarch64]
                precision: [32]
        steps:
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYVERSION }}
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 1
            - name: PureData Sources
              run: |
                  sudo apt update
                  sudo add-apt-repository ppa:pure-data/pure-data -y
                  sudo apt install puredata -y
                  sudo apt install libpipewire-0.3-dev -y
                  sudo apt install libfreetype6-dev libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev libglib2.0-dev libgtk-3-dev libasound2-dev libpulse-dev libcurl4-openssl-dev libssl-dev libfftw3-dev libsndfile1-dev libsqlite3-dev libz-dev libboost-dev -y
            - name: Install compiler
              id: compiler
              run: |
                  arch=""
                  test "${{ matrix.arch }}" != "aarch64" || arch="aarch64-linux-gnu"
                  test "${{ matrix.arch }}" != "arm" || arch="arm-linux-gnueabihf"
                  if test -n "${arch}"; then
                    sudo apt-get install -y gcc-${arch} g++-${arch}
                    echo "arch=${arch}" >> $GITHUB_OUTPUT
                  fi
            - name: Configure
              run: |
                  arch="${{ steps.compiler.outputs.arch }}"
                  openblas_target=""
                  case "${{ matrix.arch }}" in
                    aarch64) openblas_target="ARMV8" ;;
                    arm) openblas_target="ARMV7" ;;
                  esac
                  cmake . -B build \
                    -DPD_FLOATSIZE=${{ matrix.precision }} \
                    -DPD_OUTPUT_PATH="${{ github.workspace }}/xlab" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DPYVERSION=${{ env.PYVERSION }} \
                    ${arch:+-DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }}} \
                    ${arch:+-DCMAKE_C_COMPILER=${arch}-gcc -DCMAKE_CXX_COMPILER=${arch}-g++} \
                    ${arch:+${openblas_target:+-DTARGET=${openblas_target}}}
            - name: Build Object
              run: |
                  cmake --build build -- -j$(nproc)
                  #cmake --install build
            - name: Upload Object
              uses: actions/upload-artifact@v4
              with:
                  name: ${{env.LIBNAME}}-${{env.LIBVERSION}}-ubuntu-latest-${{matrix.arch}}-pd${{matrix.precision}}
                  path: ${{ github.workspace }}/${{ env.LIBNAME }}
                  if-no-files-found: error
    windows-build:
        runs-on: windows-latest
        strategy:
            matrix:
                compiler: [mingw]
                arch: [amd64]
                precision: [32]
        steps:
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ env.PYVERSION }}
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0
            - if: matrix.compiler == 'mingw'
              name: Set up Msys2
              uses: msys2/setup-msys2@v2
              with:
                  msystem: mingw64
                  install: make mingw-w64-x86_64-gcc mingw64/mingw-w64-x86_64-cmake mingw-w64-x86_64-gcc-fortran mingw-w64-x86_64-boost
                  update: false
            - name: Download Pure Data Float 32
              if: matrix.precision == '32'
              shell: pwsh
              run: |
                  $pdName = 'pd-0.57-0'
                  $archive = Join-Path $env:RUNNER_TEMP "$pdName.msw.zip"
                  $download = "msp.ucsd.edu/Software/$pdName.msw.zip"
                  try {
                      Invoke-WebRequest -Uri "https://$download" -OutFile $archive -TimeoutSec 60
                  } catch {
                      # Windows can reject the publisher's TLS chain. Check the pinned digest for either download.
                      Write-Warning 'Pure Data HTTPS download failed. Trying HTTP with SHA-256 verification.'
                      Invoke-WebRequest -Uri "http://$download" -OutFile $archive -TimeoutSec 60
                  }

                  $expectedHash = '1C128583E9BB78C42C88AF72E02951D3808AF6598A0A68ABF0EDA61E8D2BC4A3'
                  if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
                      throw 'Pure Data ZIP SHA-256 mismatch.'
                  }
                  Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
                  $pdRoot = Join-Path $env:RUNNER_TEMP $pdName
                  "PD_ROOT=$pdRoot" >> $env:GITHUB_ENV
            - name: Install PureData Float 64
              if: matrix.precision == '64'
              run: |
                  winget install -e --id MillerPuckette.Pd64 --accept-source-agreements
            - name: Configure and build Mingw
              shell: msys2 {0}
              if: matrix.compiler == 'mingw'
              run: |
                  PD_OUT="$(cygpath -u "$GITHUB_WORKSPACE"/xlab)"
                  pd_paths=()
                  if [[ -n "${PD_ROOT:-}" ]]; then
                      pd_root="$(cygpath -m "$PD_ROOT")"
                      pd_paths=(-DPD_SOURCES_PATH="$pd_root/src" -DPDBINDIR="$pd_root/bin")
                  fi
                  cmake . -B build \
                    -DPD_FLOATSIZE=${{ matrix.precision }} \
                    -DPD_OUTPUT_PATH="$PD_OUT" \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DPYVERSION=${{ env.PYVERSION }} \
                    -DTARGET=CORE2 \
                    "${pd_paths[@]}"
                  cmake --build build --parallel
                  #cmake --install build
            - name: Upload
              uses: actions/upload-artifact@v4
              with:
                  name: ${{env.LIBNAME}}-${{env.LIBVERSION}}-windows-latest-${{matrix.arch}}-pd${{matrix.precision}}
                  path: ${{ github.workspace }}/${{ env.LIBNAME }}
                  if-no-files-found: error
    publish-release:
        if: ${{ github.ref_type == 'tag' }}
        needs: [macos, linux-build, windows-build]
        runs-on: ubuntu-latest
        steps:
            - name: Download Pure Data artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-*-pd*
                  merge-multiple: true
                  path: release/pd/${{ env.LIBNAME }}
            - name: Verify release contents
              run: |
                  test -d "release/pd/${LIBNAME}"
                  test -n "$(find "release/pd/${LIBNAME}" -type f -print -quit)"
                  find release/pd -maxdepth 4 -type f -print
            - name: Package and upload Pure Data library to Deken
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              run: |
                  if [[ -z "$DEKEN_PASSWORD" ]]; then
                    echo "::error::Set the DEKEN_PASSWORD repository secret before publishing."
                    exit 1
                  fi

                  docker run --rm \
                    --user "$(id -u):$(id -g)" \
                    --volume "${GITHUB_WORKSPACE}:/deken" \
                    --workdir /deken \
                    registry.git.iem.at/pd/deken \
                    deken package --version "${LIBVERSION}" "release/pd/${LIBNAME}"

                  shopt -s nullglob
                  deken_packages=(*.dek)
                  test ${#deken_packages[@]} -gt 0

                  docker run --rm \
                    --user "$(id -u):$(id -g)" \
                    --volume "${GITHUB_WORKSPACE}:/deken" \
                    --workdir /deken \
                    -e DEKEN_USERNAME -e DEKEN_PASSWORD \
                    registry.git.iem.at/pd/deken \
                    deken upload --no-source-error -v "${LIBVERSION}" "${deken_packages[@]}"
            - name: Create all-platforms archive
              run: |
                  cd release/pd
                  zip -r "${GITHUB_WORKSPACE}/${LIBNAME}-${LIBVERSION}-all-platforms.zip" "${LIBNAME}"
            - name: Create / Update GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ env.LIBVERSION }}
                  name: ${{ env.LIBNAME }} ${{ env.LIBVERSION }}
                  target_commitish: ${{ github.sha }}
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: |
                      ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-all-platforms.zip
                      *.dek
                  draft: false
                  prerelease: false
